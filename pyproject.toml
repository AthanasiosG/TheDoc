[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thedoc"
version = "0.1.0"
description = "TheDoc Discord bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4.0",
    "aiosqlite>=0.20.0",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]